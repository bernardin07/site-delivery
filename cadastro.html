<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Best Burger</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="container">
                <div class="nav-brand">
                    <img src="B (1) 1.png" alt="Best Burger Logo" class="logo">
                    <span class="brand-name">Best Burger</span>
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link">HOME</a></li>
                    <li><a href="menu.html" class="nav-link">MENU</a></li>
                    <li><a href="quemsomos.html" class="nav-link">QUEM SOMOS</a></li>
                    <li><a href="contato.html" class="nav-link">CONTATO</a></li>
                    <li><a href="cadastro.html" class="nav-link active">CADASTRO</a></li>
                    <li><a href="pedidos.html" class="nav-link btn-order">PEDIDOS</a></li>
                </ul>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </nav>
    </header>

    <div class="page-wrapper">
        <div class="container">
            <div class="form-container">
                <div class="form-header">
                    <h1 class="form-title">Cadastre-se</h1>
                    <p class="form-subtitle">Crie sua conta e aproveite ofertas exclusivas!</p>
                </div>

                <div id="formMessage"></div>

                <form class="contact-form" id="registerForm">
                    <div class="form-group">
                        <label for="fullName">Nome Completo</label>
                        <input type="text" id="fullName" name="fullName" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Número de Telefone</label>
                        <input type="tel" id="phone" name="phone" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="address">Endereço Completo</label>
                        <textarea id="address" name="address" class="form-control" rows="3" placeholder="Rua, número, bairro, cidade" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirmar Senha</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms" name="terms" required>
                            <span class="checkmark"></span>
                            Aceito os <a href="#" class="link">termos de uso</a> e <a href="#" class="link">política de privacidade</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Criar Conta</button>
                </form>

                <div class="form-footer">
                    <p>Já tem uma conta? <a href="#" class="link">Faça login</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/forms.js"></script>
</body>
</html>
